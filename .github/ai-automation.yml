# Repo-owned automation contract for f8qtn9kycq-crypto/rehab-workout.
# Scheduled runners must read this file before choosing work or mutating GitHub.
version: 1

repository:
  full_name: f8qtn9kycq-crypto/rehab-workout
  default_branch: main
  product: rehab-workout
  expected_remotes:
    - https://github.com/f8qtn9kycq-crypto/rehab-workout.git
    - git@github.com:f8qtn9kycq-crypto/rehab-workout.git

source_of_truth:
  required_before_work:
    - AGENTS.md
    - REVIEW.md
    - .github/pull_request_template.md
    - .github/ai-automation.yml
    - docs/ai-workflow.md
    - docs/pr-workflow.md
    - docs/codex-issue-workflow.md
  supporting_docs:
    - docs/product-scope.md
    - docs/architecture.md
    - docs/exercise-data-model.md
    - docs/safety-rules.md
    - docs/mobile-ux-guidelines.md
    - docs/localization-style-guide.md
    - docs/project-source-hygiene.md
    - ai/skills/rehab-workout-issue-to-pr/SKILL.md

preflight:
  required_before_github_mutation:
    - local_git_remote_matches_repository_full_name
    - github_repo_query_matches_repository_full_name
    - repo_tracked_instructions_match_product
    - default_branch_is_synced_before_branch_creation
  mismatch_behavior: repo-mismatch blocker
  missing_contract_behavior: stop_without_mutation
  stale_or_ambiguous_context_behavior: prefer_repo_tracked_files

execution:
  max_units_per_run: 1
  allowed_chain:
    - issue implementation
    - pull request creation or update
    - ChatGPT pull request review when required
    - ChatGPT PM synthesis request and exact-head result publication when required or triggered
    - verdict retrieval
    - gate-based action on verdict
  disallowed_by_default:
    - bulk-triggering Codex
    - broad unrelated refactors
    - direct commits to main
    - automatic merge without explicit contract eligibility
    - changing product safety thresholds unless the selected issue explicitly scopes it

selection:
  issue_order:
    priority: [P0, P1, P2]
    status: [Ready for Codex, Backlog]
    risk_tier: [Tier 0, Tier 1, Tier 2, Tier 3]
    tie_breaker: oldest_first
  pr_order:
    priority: [P0, P1, P2]
    status: [PR Review, Review, Ready to Merge]
    risk_tier: [Tier 0, Tier 1, Tier 2, Tier 3]
    tie_breaker: oldest_first
  readiness_required_fields:
    - goal_or_user_problem
    - scope
    - priority
    - risk_tier
    - ai_owner_codex_or_equivalent
    - safety_constraints
    - acceptance_criteria
    - qa_or_validation_requirements
    - codex_trigger_or_implementation_contract

validation:
  default:
    - npm run build
  if_test_script_exists:
    - npm run test
  if_exercise_data_filters_recommendations_or_coverage_change:
    - npm run audit:exercise-coverage
  if_safety_session_storage_or_routing_change:
    - verify SafetyGate cannot be bypassed
    - verify pain >=6 blocks training
    - verify red flags block training
    - verify SafetyRouteGuard behavior
    - verify LocalStorage compatibility
    - consider iOS Safari and SPA routing risk
  docs_only:
    - confirm no product source files under src changed
    - confirm no app behavior changed
    - confirm no safety, session, storage, routing, recommendation, or exercise data behavior changed

risk_tiers:
  Tier 0:
    description: docs, copy, templates, or small CSS with no runtime behavior change
    review_routing:
      codex_review: optional
      claude_review: not_required_unless_findings_conflict
      chatgpt_pm_synthesis: not_required_unless_findings_conflict
    auto_merge_eligible: true
  Tier 1:
    description: mobile UX, i18n, navigation, or low-risk runtime UX
    review_routing:
      codex_review: recommended
      claude_review: not_required_unless_safety_session_or_routing_risk_appears
      chatgpt_pm_synthesis: optional_for_conflicting_findings
    auto_merge_eligible: false
  Tier 2:
    description: safety-adjacent product flow, session, storage, routing, or recommendation behavior
    review_routing:
      codex_review: required
      claude_review: recommended
      chatgpt_pm_synthesis: recommended_for_conflicting_findings_or_merge_gate
    auto_merge_eligible: false
  Tier 3:
    description: architecture, data migration, security, safety logic, recommendation safety rules, or exercise content changes
    review_routing:
      codex_review: required
      claude_review: required
      chatgpt_pm_synthesis: required_before_merge
    auto_merge_eligible: false

pull_request_state_policy:
  draft_means:
    - implementation_incomplete
    - required_current_head_automated_evidence_incomplete
  mark_ready_for_review_when:
    - implementation_complete
    - required_current_head_checks_pass
    - no_known_blocking_P0
    - P1_findings_are_fixed_or_explicitly_deferred
  do_not_keep_draft_only_because:
    - human_walkthrough_is_absent
    - authenticated_preview_is_unavailable_to_automation
    - physical_iPhone_Safari_evidence_is_absent
    - sole_contributor_cannot_formally_self_approve
  manual_evidence_blocks_only_when:
    - changed_behavior_cannot_be_validated_reliably_by_automation
    - explicit_acceptance_criterion_requires_the_environment
    - unresolved_P0_or_P1_requires_human_confirmation
    - Tier_3_change_includes_safety_logic_destructive_migration_or_security_sensitive_behavior

approval_policy:
  sole_contributor:
    applies_only_when:
      - live_repository_collaborator_count_is_exactly_one
      - pull_request_author_is_that_collaborator
    identity_unverifiable_behavior: do_not_assume_sole_contributor_eligibility
    otherwise: follow_live_branch_protection_rulesets_and_requested_review_requirements
    formal_self_approval_required: false
    merge_readiness_default:
      - required_AI_review_routing_complete
      - current_head_required_checks_pass
      - no_active_requested_changes_review
      - no_unresolved_blocking_review_threads
      - clean_mergeability
      - product_safety_and_acceptance_gates_pass
    tier_3_additional_requirements:
      - Claude_Tier_3_review
      - ChatGPT_PM_synthesis
    conditional_human_walkthrough:
      - safety_logic_change_not_reliably_covered_by_automation
      - destructive_or_irreversible_data_migration
      - security_sensitive_behavior
      - explicit_acceptance_criterion_requires_manual_or_physical_device_evidence
    constraints:
      - never_claim_formal_github_approve_when_none_exists

auto_merge:
  allowed_only_when:
    - explicit_user_merge_authorization
    - risk_tier_is_Tier_0
    - changed_files_are_limited_to_docs_templates_comments_or_non_runtime_workflow_instructions
    - no_src_files_changed
    - no_app_behavior_changed
    - no_safety_session_storage_routing_recommendation_or_exercise_data_behavior_changed
    - pull_request_template_is_complete
    - required_checks_pass_on_current_head
    - no_active_requested_changes_review
    - no_P0_findings_remain
    - P1_findings_are_fixed_or_explicitly_deferred
    - acceptance_criteria_are_met
    - branch_cleanup_plan_exists
  workflow_pr_extra_requirements:
    - PROJECTS_TOKEN_remains_required_for_Projects_V2_field_writes
    - no_fallback_to_github_token_for_Projects_V2_field_writes
    - Project_owner_type_remains_explicit_when_Project_V2_automation_is_touched
    - post_merge_runtime_validation_is_listed_when_behavior_depends_on_real_GitHub_events

control_plane:
  tier_3_ai_review_request:
    automatic_events:
      - pull_request_target.opened
      - pull_request_target.edited
      - pull_request_target.labeled
      - pull_request_target.reopened
      - pull_request_target.synchronize
      - pull_request_target.ready_for_review
    requirements:
      - use_trusted_default_branch_workflow_only
      - never_checkout_or_execute_pull_request_code
      - require_risk_tier_3_label_or_checked_template_field
      - request_Claude_and_ChatGPT_PM_for_exact_head
      - deduplicate_by_exact_head_sha
      - treat_request_as_pending_until_attributable_results_exist
  chatgpt_pm_synthesis:
    request_triggers:
      - PR body or label requires synthesis by risk tier or conflicting findings
      - explicit PR comment containing "ChatGPT PM synthesis"
    result_comment_requirements:
      - publish to the same PR as a GitHub comment
      - include exact current head SHA and trigger reason
      - include scope, risk tier, product impact, validation and current-head checks
      - include review/thread state, mergeability, blockers, and recommendation
      - state that the result is supplemental and not a formal GitHub approval
      - reject stale results when the PR head SHA has changed
  labels:
    ready_for_implementation:
      - codex-ready
    review_required:
      - review-required
      - chatgpt-review-required
      - claude-review-required
    automation:
      - automerge-allowed
      - blocked
      - repo-mismatch
    priority:
      - priority:P0
      - priority:P1
      - priority:P2
    risk:
      - risk:tier-0
      - risk:tier-1
      - risk:tier-2
      - risk:tier-3
  project_fields:
    status:
      backlog: Backlog
      ready_for_codex: Ready for Codex
      in_progress: In Progress
      review: Review
      ready_to_merge: Ready to Merge
      done: Done
    priority:
      - P0
      - P1
      - P2
    risk_tier:
      - Tier 0
      - Tier 1
      - Tier 2
      - Tier 3

boundaries:
  do_not_touch_without_explicit_scope:
    - safety thresholds
    - red-flag blocking
    - SafetyGate bypass rules
    - SafetyRouteGuard
    - LocalStorage schema compatibility
    - recommendation safety filters
    - exercise content coverage
    - Vercel deployment behavior
  stop_conditions:
    - repo-mismatch blocker
    - missing required workflow contract
    - unclear selected issue scope
    - validation failure
    - current-head CI failure
    - active requested-changes review
    - safety/session/storage/routing ambiguity above selected risk tier

reporting:
  required_output:
    - verdict
    - selected unit of work
    - files changed or inspected
    - validation evidence
    - review verdicts retrieved
    - merge or stop reason
    - next recommended action

# 集中的風險與審查補充：由既有 AGENTS／REVIEW／workflow 文件搬移，非新增門檻。
risk_classification_policy:
- 實作前依 risk_tiers 分級；純文件描述既有行為為 Tier 0，實際產品變更依最高受影響風險分級。
- 產品安全契約仍依 AGENTS.md 與 docs/safety-rules.md；此處只集中工作流程，不改產品規則。
review_policy:
  objective: 以最小額外範圍達到可審查、可驗證的合併就緒狀態，不建議廣泛重寫。
  severity:
    P0:
    - build 失敗。
    - 主要使用流程中斷或重大行動版可用性阻塞。
    - 安全 gate 可繞過、pain >=6 可開始訓練、紅旗未阻擋或其他安全回歸。
    - 必要 session state 遺失。
    - iOS Safari／SPA 路由或載入破壞核心使用。
    - 既有使用者資料有遺失風險。
    P1:
    - 會影響一般使用的行動導覽混淆、重要控制隱藏、過密文案。
    - i18n 不一致或無障礙問題（含主要控制缺少標籤）。
    - 變更行為缺乏測試／QA 證據，或一般使用容易遇到的邊界問題。
    - 可靠自動化已涵蓋且無明確環境要求時，單獨缺少真人／實體裝置／Preview 證據不列 P1。
    P2:
    - 僅列 backlog，不阻擋合併；未明確要求時不列 wishlist。
  findings:
  - 優先高信心 finding，不列主觀風格意見、廣泛架構重寫或重複 finding；已有其他 reviewer 提出時只補新證據。
  - 每個 P0／P1 必須列檔案、行為、風險與接受條件；P0 合併前必修，P1 在本 PR 修復或依契約明確 defer。
  - 確認 PR template 已填 scope、risk tier、安全影響、QA、AI routing、merge readiness 與清理計畫。
  routing_and_evidence:
  - 逐項記錄適用審查的必要性、requested／Pending／completed／不適用、具名 reviewer、head SHA 與結果連結；建議審查未採用時記錄原因。請求不等於完成，AI 結果不等於正式 GitHub APPROVE。
  - 審查路由唯一依據為 risk_tiers.<Tier>.review_routing；Tier 0／1 不額外要求 Claude／PM，除非 finding 衝突或升級的安全／session／routing 風險。
  - Tier 2+ 明確核對 SafetyGate、疼痛與紅旗規則、session route guard、LocalStorage 相容及 iOS Safari／SPA 風險。
  - 真人／真機 gate 僅依 pull_request_state_policy.manual_evidence_blocks_only_when 與 approval_policy；不是一律要求。
  - Tier 0 workflow 變更範圍窄、證據完整、CI 通過時，真人 review 建議但非必要；衝突或超出 workflow/docs 時重新依最高風險判定。
  - UI 變更需檢查 320px／375px mobile QA；依影響補足其他環境，可採可靠瀏覽器自動化，真人／真機 gate 仍依上述條件。
  - 本機、CI、瀏覽器自動化、真人、真機與 production 分開報告；未量測效能不宣稱效能改善。
  exact_head_gate:
  - 記錄 repo、PR、base、head branch 與當前 head SHA；push／rebase／head 改變後先前審查與 QA 不直接沿用。
  - 即時 branch protection／ruleset 決定 required contexts 與 GitHub App；Check Runs 必須成功且對應同一 head。較新的必要 run pending／fail 時不得用較早
    success 覆蓋。
  - Legacy Commit Status 為空不代表失敗；若相符 required Check Run 已成功，採用該證據。缺少／過期／Pending／失敗不得判 Pass，禁止 synthetic status。
  - 檢查 active requested changes、未解決 blocking threads、必要 review、Draft、衝突、mergeability；unknown／unstable 先重新查詢。
  - P0 已修、P1 已修或明確 defer、接受條件通過、PR template 完整、無無關重構且有分支清理計畫；runtime 依 validation 與 mobile/storage/routing 影響補足證據。
  - 分開報告產品／程式就緒與 workflow／合併就緒；使用者明確授權後，合併前重查所有門檻並以 expected head SHA 執行。Pass、契約與自動化資格本身不是授權。
  specialized_reviews:
    modal:
    - 背景隔離、初始焦點、Tab／Shift+Tab 循環、enabled 控制項、Escape 明確語意、返回觸發按鈕、小視窗控制可見／可捲動。
    - 影片關閉卸載 iframe；退出訓練的取消／繼續保留進度且不寫紀錄；跨來源播放器鍵盤能力另標證據邊界。
    exercise_art: 動作圖或 image-ID alias 變更依 docs/exercise-visual-qa.md，分別記錄視覺、動作、安全呈現、mobile；依具體步驟／參考差異，不以同URL或主觀喜好判動作正確。
  output:
  - 'Verdict: Pass / Partial Pass / Fail'
  - P0 blockers
  - P1 improvements
  - Exact files to change
  - Acceptance criteria
  - Suggested next Codex command
  auto_merge_note: 資格與額外門檻只依 auto_merge；Tier 1 以上不啟用盲目 auto-merge。所有 Tier 仍需明確授權。
  workflow_validation:
  - workflow-only 自動化資格另需檔案範圍限 .github/workflows/* 與支持文件，並在可行範圍驗證 YAML／shell 語法；其餘額外條件依 auto_merge.workflow_pr_extra_requirements。
