name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python for movement-art verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen movement art and effective sources
        run: |
          python -m pip install -r scripts/movement-art-requirements.txt -r scripts/workflow-requirements.txt
          npm run audit:movement-art
          npm run audit:movement-art-sources

      - name: Workflow regression fixtures
        run: python3 scripts/workflow-regression.py

      - name: Build
        run: npm run build

      - name: Smoke and visible i18n guardrails
        run: npm run test

      - name: Safety i18n guardrail
        run: npm run audit:safety-i18n
