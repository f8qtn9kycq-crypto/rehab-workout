name: ChatGPT PM synthesis

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to receive the synthesis result
        required: true
        type: string
      head_sha:
        description: Exact PR head SHA reviewed by ChatGPT
        required: true
        type: string
      result:
        description: ChatGPT PM synthesis result to publish verbatim
        required: true
        type: string
      trigger_reason:
        description: Why synthesis was required or triggered
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  request:
    name: Request exact-head AI reviews
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, 'ChatGPT PM synthesis'))
    runs-on: ubuntu-latest
    steps:
      - name: Record exact-head request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          state="$(jq -r '.state' <<<"$pr_json")"

          if [[ "$state" != "open" ]]; then
            echo "PR #$PR_NUMBER is not open; no synthesis request recorded."
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then
            is_tier_3="$(jq -r '
              ([.labels[].name] | any(. == "risk:tier-3")) or
              ((.body // "") | test("(?im)^\\s*- \\[x\\] Tier 3:"))
            ' <<<"$pr_json")"
            if [[ "$is_tier_3" != "true" ]]; then
              echo "PR #$PR_NUMBER is not marked Tier 3; no AI review request created."
              exit 0
            fi
          fi

          marker="<!-- tier3-ai-review-request: head_sha=$head_sha -->"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)"
          if [[ -n "$existing" ]]; then
            echo "Exact-head AI review request already exists for $head_sha."
            exit 0
          fi

          body="$(jq -rn --arg marker "$marker" --arg sha "$head_sha" --arg pr "$PR_NUMBER" --arg event "$GITHUB_EVENT_NAME" '
            [
              $marker,
              "@claude Please perform the required Tier 3 review for PR #\($pr) at exact head `\($sha)`.",
              "",
              "ChatGPT PM synthesis requested for PR #\($pr).",
              "",
              "- Exact head SHA: `\($sha)`",
              "- Trigger: \($event)",
              "- Claude scope: full current diff, safety/session/storage/routing risk, regressions, and P0/P1 findings.",
              "- ChatGPT scope: product impact, validation, current-head checks, review/thread state, mergeability, blockers, and recommendation.",
              "- Result publication: use the exact-head publish path; reject the result if the head changes.",
              "",
              "This request is not merge authorization or a formal GitHub approval."
            ] | join("\n")
          ')"

          jq -n --arg body "$body" '{body: $body}' |
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input - >/dev/null

  publish:
    name: Publish synthesis result
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Validate exact head and publish result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          SYNTHESIS_RESULT: ${{ inputs.result }}
          TRIGGER_REASON: ${{ inputs.trigger_reason }}
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::pull_request_number must be numeric."
            exit 1
          fi
          if ! [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::head_sha must be a full commit SHA."
            exit 1
          fi
          if [[ -z "$SYNTHESIS_RESULT" ]]; then
            echo "::error::result must not be empty."
            exit 1
          fi

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          actual_head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          state="$(jq -r '.state' <<<"$pr_json")"

          if [[ "$state" != "open" ]]; then
            echo "::error::PR #$PR_NUMBER is not open."
            exit 1
          fi
          if [[ "$actual_head_sha" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "::error::Stale synthesis: expected $EXPECTED_HEAD_SHA but PR head is $actual_head_sha."
            exit 1
          fi

          body="$(jq -rn \
            --arg sha "$EXPECTED_HEAD_SHA" \
            --arg reason "$TRIGGER_REASON" \
            --arg result "$SYNTHESIS_RESULT" '
            [
              "<!-- chatgpt-pm-synthesis-result: head_sha=\($sha) -->",
              "## ChatGPT PM synthesis",
              "",
              "- Exact head SHA: `\($sha)`",
              "- Trigger reason: \($reason)",
              "- This is supplemental synthesis, not a formal GitHub approval.",
              "",
              $result
            ] | join("\n")
          ')"

          jq -n --arg body "$body" '{body: $body}' |
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input - >/dev/null
